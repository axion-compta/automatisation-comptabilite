name: Portier

# Fait tourner scripts/pilotage/portier.mjs, lu depuis main (jamais le code de la PR).
# Inactif tant que IDENTIFIANTS_RELECTEUR contient A_RENSEIGNER_PAR_WILL (refus de tout).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Numéro de la PR à examiner
        required: true
        type: string

permissions: {}

concurrency:
  group: portier
  cancel-in-progress: false

jobs:
  portier:
    name: portier
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/pilotage/portier.mjs "$NUMERO_PR"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO_PR: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}
